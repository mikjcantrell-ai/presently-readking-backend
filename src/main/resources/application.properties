# ── Server ──────────────────────────────────────────────────────────────────
server.port=${PORT:8086}

# ── SQLite DataSource ────────────────────────────────────────────────────────
# In production (Railway), set DB_PATH env var to /data/presentlyreading.db (persistent volume)
spring.datasource.url=jdbc:sqlite:${DB_PATH:presentlyreading.db}
spring.datasource.driver-class-name=org.sqlite.JDBC

# ── File Upload Directory ────────────────────────────────────────────────────
upload.dir=${UPLOAD_DIR:uploads}

# ── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# SQLite does not support sequences; use identity generation
spring.jpa.properties.hibernate.globally_quoted_identifiers=false

# ── Application name ─────────────────────────────────────────────────────────
spring.application.name=presently-reading

# ── Security (admin endpoints) ───────────────────────────────────────────────
spring.security.user.name=${ADMIN_USER:admin}
spring.security.user.password=${ADMIN_PASSWORD:T@ylor55}

# ── Gmail SMTP (for reply emails) ────────────────────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:mikjcantrell@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ── Spotify API Defaults ─────────────────────────────────────────────────────
spotify.api.default.limit=10

# ── File Upload Limits ───────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ── Spotify Integration ─────────────────────────────────────────────────────────
spotify.client.id=${SPOTIFY_CLIENT_ID:1b00cfecc0634cb98a65b26e55d94896}
spotify.client.secret=${SPOTIFY_CLIENT_SECRET:c662df00126f44669436364c4d58c7c9}

# ── Google Gemini Integration ───────────────────────────────────────────────
gemini.api.key=${GEMINI_API_KEY:}

